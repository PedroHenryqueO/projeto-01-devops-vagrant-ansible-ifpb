---
- name: Configurar usuarios e servicos comuns
  hosts: lab
  become: true
  tasks:
    - name: Atualizar os indices do APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        # Atualização completa desativada por orientação do professor.
        # upgrade: dist
        lock_timeout: 180

    - name: Instalar pacotes comuns sem iniciar servicos antes da configuracao
      ansible.builtin.apt:
        name: [chrony, sudo, openssh-server, nfs-common]
        state: present
        policy_rc_d: 101

    - name: Configurar timezone
      community.general.timezone:
        name: America/Recife

    - name: Configurar Chrony
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        content: |
          pool pool.ntp.br iburst
          driftfile /var/lib/chrony/chrony.drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar chrony

    - name: Garantir Chrony habilitado
      ansible.builtin.service:
        name: chrony
        enabled: true
        state: started

    - name: Garantir grupos autorizados
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: [vagrant, ifpb]

    - name: Preservar grupo administrativo do Vagrant
      ansible.builtin.user:
        name: vagrant
        groups: vagrant
        append: true

    - name: Criar usuarios academicos
      ansible.builtin.user:
        name: "{{ item }}"
        groups: ifpb
        append: true
        shell: /bin/bash
        create_home: true
      loop: "{{ academic_users }}"

    - name: Instalar chaves publicas individuais
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ lookup('ansible.builtin.file', controller_state + '/keys/' + item + '.pub') }}"
        state: present
      loop: "{{ academic_users }}"

    - name: Configurar sudo nao interativo do laboratorio
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ifpb
        content: "%ifpb ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    # Testa as chaves em novas conexões antes e depois de restringir o SSH.
    # Confirma as chaves e o sudo sem reutilizar uma conexão SSH existente.
    - name: Verificar chave e elevacao em nova conexao SSH
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -p
          - "{{ ansible_port | default(22) | string }}"
          - -i
          - "{{ controller_state }}/keys/{{ 'vagrant-' + inventory_hostname if item == 'vagrant' else item }}"
          - -o
          - IdentitiesOnly=yes
          - -o
          - BatchMode=yes
          - -o
          - ControlMaster=no
          - -o
          - ControlPath=none
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - "UserKnownHostsFile={{ controller_state }}/known_hosts"
          - -o
          - ConnectTimeout=15
          - "{{ item }}@{{ ansible_host }}"
          - sudo -n id -u
      loop: "{{ academic_users + ['vagrant'] }}"
      register: access_probe
      failed_when: access_probe.rc != 0 or access_probe.stdout | trim != '0'
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Configurar mensagem obrigatoria
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: "Acesso apenas para pessoas com autorização expressa!!!\n"
        owner: root
        group: root
        mode: '0644'

    - name: Configurar restricoes SSH
      ansible.builtin.template:
        src: ssh.conf.j2
        dest: /etc/ssh/sshd_config.d/00-asa-proj1.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Recarregar ssh

    - name: Validar configuracao SSH completa antes de reload
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Aplicar configuracoes validadas
      ansible.builtin.meta: flush_handlers

    # Confirma as chaves e o sudo sem reutilizar uma conexão SSH existente.
    - name: Confirmar acesso apos configurar SSH
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -p
          - "{{ ansible_port | default(22) | string }}"
          - -i
          - "{{ controller_state }}/keys/{{ 'vagrant-' + inventory_hostname if item == 'vagrant' else item }}"
          - -o
          - IdentitiesOnly=yes
          - -o
          - BatchMode=yes
          - -o
          - ControlMaster=no
          - -o
          - ControlPath=none
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - "UserKnownHostsFile={{ controller_state }}/known_hosts"
          - -o
          - ConnectTimeout=15
          - "{{ item }}@{{ ansible_host }}"
          - sudo -n id -u
      loop: "{{ academic_users + ['vagrant'] }}"
      register: access_probe
      failed_when: access_probe.rc != 0 or access_probe.stdout | trim != '0'
      changed_when: false
      delegate_to: localhost
      become: false
  handlers:
    - name: Reiniciar chrony
      ansible.builtin.service:
        name: chrony
        state: restarted
    - name: Recarregar ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
