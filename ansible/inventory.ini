# Referencia dos hosts. Para administrar, use o inventario NAT gerado pelo Vagrant.
[fileservers]
arq ansible_host=arq.pedro.henryque.devops
[clients]
db ansible_host=db.pedro.henryque.devops
app ansible_host=app.pedro.henryque.devops
cli ansible_host=cli.pedro.henryque.devops
[lab:children]
fileservers
clients
[lab:vars]
ansible_user=vagrant
ansible_ssh_private_key_file='.vagrant/asa/keys/vagrant-{{ inventory_hostname }}'
