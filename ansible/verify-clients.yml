---
- name: Validar convidados
  hosts: clients
  become: true
  tasks:
    - name: Confirmar DHCP e NAT
      ansible.builtin.command: ip -4 route
      register: routes
      changed_when: false
      failed_when: "'default via 10.0.2.2 dev eth0' not in routes.stdout"
    - name: Verificar NTP sincronizado
      ansible.builtin.command: chronyc waitsync 15 1 0 2
      changed_when: false
    - name: Testar resolvedor normal
      ansible.builtin.command: "getent ahostsv4 arq.{{ domain }}"
      changed_when: false
    - name: Acionar autofs por acesso
      ansible.builtin.command: ls -la /var/nfs/
      changed_when: false
    - name: Verificar montagem NFS real
      ansible.builtin.command: findmnt -n -o FSTYPE,SOURCE -T /var/nfs
      register: nfs_mount
      changed_when: false
      failed_when: "'nfs4' not in nfs_mount.stdout or '/dados/nfs' not in nfs_mount.stdout"
    - name: Testar novas conexoes SSH e sudo
      ansible.builtin.include_tasks: roles/base/tasks/access.yml
    - name: Testar consulta MariaDB
      ansible.builtin.command:
        argv: [mariadb, -Nse, SELECT 1]
      changed_when: false
      when: inventory_hostname == 'db'
    - name: Testar pagina Apache
      ansible.builtin.uri:
        url: http://127.0.0.1/
        return_content: true
      register: page
      failed_when: "'20251380020' not in page.content"
      when: inventory_hostname == 'app'
    - name: Verificar Firefox e xauth
      ansible.builtin.command: dpkg-query -W firefox-esr xauth
      changed_when: false
      when: inventory_hostname == 'cli'
