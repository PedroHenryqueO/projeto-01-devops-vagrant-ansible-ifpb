---
- name: Atualizar indices e sistema sem reinicio automatico
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    lock_timeout: 180

- name: Instalar pacotes comuns sem iniciar servicos antes da configuracao
  ansible.builtin.apt:
    name: [chrony, sudo, openssh-server, nfs-common]
    state: present
    policy_rc_d: 101

- name: Configurar timezone
  community.general.timezone:
    name: America/Recife

- name: Configurar Chrony
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    content: |
      pool pool.ntp.br iburst
      driftfile /var/lib/chrony/chrony.drift
      makestep 1.0 3
      rtcsync
      logdir /var/log/chrony
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar chrony

- name: Garantir Chrony habilitado
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started

- name: Garantir grupos autorizados
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: [vagrant, ifpb]

- name: Preservar grupo administrativo do Vagrant
  ansible.builtin.user:
    name: vagrant
    groups: vagrant
    append: true

- name: Criar usuarios academicos
  ansible.builtin.user:
    name: "{{ item }}"
    groups: ifpb
    append: true
    shell: /bin/bash
    create_home: true
  loop: "{{ academic_users }}"

- name: Instalar chaves publicas individuais
  ansible.posix.authorized_key:
    user: "{{ item }}"
    key: "{{ lookup('ansible.builtin.file', controller_state + '/keys/' + item + '.pub') }}"
    state: present
  loop: "{{ academic_users }}"

- name: Configurar sudo nao interativo do laboratorio
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ifpb
    content: "%ifpb ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

# Conexoes novas, sem reaproveitar sockets persistentes: antes e depois do hardening.
- name: Provar autenticacao e sudo antes de restringir SSH
  ansible.builtin.include_tasks: access.yml

- name: Configurar mensagem obrigatoria
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "Acesso apenas para pessoas com autorização expressa!!!\n"
    owner: root
    group: root
    mode: '0644'

- name: Configurar restricoes SSH
  ansible.builtin.template:
    src: ssh.conf.j2
    dest: /etc/ssh/sshd_config.d/00-asa-proj1.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Recarregar ssh

- name: Validar configuracao SSH completa antes de reload
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Aplicar configuracoes validadas
  ansible.builtin.meta: flush_handlers

- name: Provar acesso administrativo apos hardening
  ansible.builtin.include_tasks: access.yml
