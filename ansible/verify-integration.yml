---
- name: Escrever dados compartilhados pelo servidor web
  hosts: app
  become: true
  tasks:
    - name: Gravar como usuarios academicos atraves de autofs
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ item }}"
          - --
          - python3
          - -c
          - "from pathlib import Path; Path('/var/nfs/{{ item }}.txt').write_text('Projeto 01 - {{ item }} - 20251380020\\n')"
      loop: "{{ academic_users }}"

- name: Ler dados em todos os convidados e verificar mapeamento
  hosts: clients
  become: true
  tasks:
    - name: Ler via NFS
      ansible.builtin.command: "cat /var/nfs/{{ item }}.txt"
      loop: "{{ academic_users }}"
      register: read_probe
      changed_when: false
      failed_when: "'20251380020' not in read_probe.stdout or item not in read_probe.stdout"

- name: Validar nomes e propriedade no servidor
  hosts: arq
  become: true
  tasks:
    - name: Consultar A de cada cliente real
      ansible.builtin.command: "dig @127.0.0.1 +short {{ item }}.{{ domain }} A"
      loop: [db, app, cli]
      register: dns_probe
      changed_when: false
      failed_when: dns_probe.stdout | trim != hostvars[item].ansible_host
    - name: Consultar PTR dos clientes
      ansible.builtin.command: "dig @127.0.0.1 +short -x {{ hostvars[item].ansible_host }}"
      loop: [db, app, cli]
      register: ptr_probe
      changed_when: false
      failed_when: ptr_probe.stdout | trim != item + '.' + domain + '.'
    - name: Conferir dono recebido pelo servidor
      ansible.builtin.stat:
        path: "/dados/nfs/{{ item }}.txt"
      loop: "{{ academic_users }}"
      register: file_probe
      failed_when: file_probe.stat.uid != nfs_uid or file_probe.stat.gid != nfs_gid
