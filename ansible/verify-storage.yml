---
- name: Validar LVM e NFS sem reinicio
  hosts: fileservers
  become: true
  tasks:
    - name: Validar novamente identidades dos PVs
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/asa-validate-disks, "{{ storage_disks | map(attribute='serial') | list | to_json }}"]
      changed_when: false

    - name: Consultar PVs
      ansible.builtin.command: pvs --reportformat json -o pv_name,vg_name
      register: pv_report
      changed_when: false

    - name: Assegurar tres PVs no VG dados
      ansible.builtin.assert:
        that: (pv_report.stdout | from_json).report[0].pv | selectattr('vg_name', 'equalto', 'dados') | list | length == 3

    - name: Consultar VG
      ansible.builtin.command: vgs dados
      changed_when: false

    - name: Consultar LV em bytes
      ansible.builtin.command: lvs --reportformat json --units b --nosuffix -o lv_name,lv_size dados/ifpb
      register: lv_report
      changed_when: false

    - name: Assegurar LV de 15 GiB
      ansible.builtin.assert:
        that: (lv_report.stdout | from_json).report[0].lv[0].lv_size | float | int == 16106127360

    - name: Verificar filesystem montado
      ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE --mountpoint /dados
      register: mounted_data
      changed_when: false
      failed_when: "'/dev/mapper/dados-ifpb' not in mounted_data.stdout or 'ext4' not in mounted_data.stdout"

    - name: Verificar entrada persistente por UUID
      ansible.builtin.command: findmnt --fstab --evaluate -n -o SOURCE,FSTYPE --mountpoint /dados
      register: persistent_data
      changed_when: false
      failed_when: "'/dev/mapper/dados-ifpb' not in persistent_data.stdout or 'ext4' not in persistent_data.stdout"

    - name: Inspecionar usuario sem login
      ansible.builtin.command: getent passwd nfs-ifpb
      register: nfs_user
      changed_when: false
      failed_when: "not nfs_user.stdout.endswith(':/usr/sbin/nologin')"

    - name: Inspecionar permissoes locais
      ansible.builtin.stat:
        path: /dados/nfs
      register: nfs_directory

    - name: Assegurar dono e escrita exclusiva
      ansible.builtin.assert:
        that:
          - nfs_directory.stat.uid == nfs_uid
          - nfs_directory.stat.gid == nfs_gid
          - nfs_directory.stat.mode == '0755'

    - name: Verificar servico e dependencia de montagem
      ansible.builtin.command: systemctl show nfs-server -p ActiveState -p RequiresMountsFor -p BindsTo
      register: nfs_unit
      changed_when: false
      failed_when: "'ActiveState=active' not in nfs_unit.stdout or 'dados.mount' not in nfs_unit.stdout or '/dados' not in nfs_unit.stdout"

    - name: Verificar exportacoes efetivas
      ansible.builtin.command: exportfs -v
      register: exports_probe
      changed_when: false
      failed_when: "'192.168.56.0/24' not in exports_probe.stdout or 'all_squash' not in exports_probe.stdout or 'async' in exports_probe.stdout or 'anonuid=2048' not in exports_probe.stdout or 'anongid=2048' not in exports_probe.stdout"

    - name: Preparar ponto temporario para teste NFS real
      ansible.builtin.tempfile:
        state: directory
        path: /mnt
        prefix: asa-nfs-
      register: probe_dir

    - name: Testar protocolo NFS e mapeamento de identidades
      block:
        - name: Montar exportacao pela interface privada sem mudar fstab
          ansible.posix.mount:
            src: "{{ dns_ip }}:/dados/nfs"
            path: "{{ probe_dir.path }}"
            fstype: nfs4
            opts: rw,proto=tcp,soft,timeo=20,retrans=2
            state: ephemeral

        - name: Escrever via NFS como cada usuario academico
          ansible.builtin.command:
            argv: [runuser, -u, "{{ item }}", --, touch, "{{ probe_dir.path }}/.{{ probe_dir.path | basename }}-{{ item }}"]
          loop: "{{ academic_users }}"

        - name: Conferir proprietario real dos arquivos recebidos
          ansible.builtin.stat:
            path: "/dados/nfs/.{{ probe_dir.path | basename }}-{{ item }}"
          loop: "{{ academic_users }}"
          register: mapped_files

        - name: Assegurar mapeamento all_squash dos dois usuarios
          ansible.builtin.assert:
            that:
              - item.stat.uid == nfs_uid
              - item.stat.gid == nfs_gid
          loop: "{{ mapped_files.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Confirmar escrita local negada a pedro
          ansible.builtin.command:
            argv: [runuser, -u, pedro, --, touch, "/dados/nfs/.{{ probe_dir.path | basename }}-denied"]
          register: local_denied
          changed_when: false
          failed_when: local_denied.rc == 0 or 'Permission denied' not in local_denied.stderr
      always:
        - name: Desmontar ponto temporario
          ansible.posix.mount:
            path: "{{ probe_dir.path }}"
            state: unmounted

        - name: Remover arquivos exclusivos do teste
          ansible.builtin.file:
            path: "/dados/nfs/.{{ probe_dir.path | basename }}-{{ item }}"
            state: absent
          loop: "{{ academic_users + ['denied'] }}"

        - name: Remover diretorio temporario vazio
          ansible.builtin.command:
            argv: [rmdir, "{{ probe_dir.path }}"]

    - name: Exibir estado final dos discos
      ansible.builtin.command: lsblk -b -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS
      register: storage_report
      changed_when: false

    - name: Registrar estado observado
      ansible.builtin.debug:
        var: storage_report.stdout_lines
