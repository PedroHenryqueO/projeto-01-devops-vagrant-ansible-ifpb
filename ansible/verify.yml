---
- name: Testes reais de arq sem clientes DHCP
  hosts: fileservers
  become: true
  tasks:
    - name: Verificar servicos
      ansible.builtin.command:
        argv: [systemctl, is-active, chrony, ssh, named, isc-dhcp-server]
      changed_when: false

    - name: Verificar timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: timezone_probe
      changed_when: false
      failed_when: timezone_probe.stdout | trim != 'America/Recife'

    - name: Conferir grupos dos usuarios
      ansible.builtin.command: "id -nG {{ item }}"
      loop: "{{ academic_users }}"
      register: groups_probe
      changed_when: false
      failed_when: "'ifpb' not in groups_probe.stdout.split()"

    - name: Conferir SSH efetivo
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_effective
      changed_when: false

    - name: Assegurar politica SSH completa
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in ssh_effective.stdout_lines"
          - "'passwordauthentication no' in ssh_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in ssh_effective.stdout_lines"
          - "'authenticationmethods publickey' in ssh_effective.stdout_lines"
          - "ssh_effective.stdout_lines | select('match', '^allowgroups ') | map('regex_replace', '^allowgroups ', '') | map('split') | flatten | sort == ['ifpb', 'vagrant']"
          - "'banner /etc/issue.net' in ssh_effective.stdout_lines"

    - name: Provar chaves pessoais e Vagrant em conexoes novas
      ansible.builtin.include_tasks: roles/base/tasks/access.yml

    - name: Verificar negativa de autenticacao sem chave
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - PubkeyAuthentication=no
          - -o
          - PreferredAuthentications=password,keyboard-interactive
          - -o
          - "UserKnownHostsFile={{ controller_state }}/known_hosts"
          - -o
          - StrictHostKeyChecking=yes
          - "pedro@{{ ansible_host }}"
          - id
      delegate_to: localhost
      become: false
      register: denied_password
      changed_when: false
      failed_when: denied_password.rc == 0 or 'Permission denied' not in denied_password.stderr

    - name: Verificar chrony sincronizado com fonte real
      ansible.builtin.command: chronyc waitsync 15 1 0 2
      changed_when: false

    - name: Mostrar fontes NTP
      ansible.builtin.command: chronyc sources -v
      changed_when: false
      register: ntp_sources

    - name: Registrar fontes observadas
      ansible.builtin.debug:
        var: ntp_sources.stdout_lines

    - name: Validar HTTPS com DNS e rota atuais
      ansible.builtin.uri:
        url: https://deb.debian.org/debian/
        status_code: 200
        timeout: 20

    - name: Validar resolucao direta pelo servidor privado
      ansible.builtin.command:
        argv: [dig, '@192.168.56.120', +short, "{{ item.name }}.{{ domain }}", A]
      loop: "{{ server_records }}"
      register: forward_probe
      changed_when: false
      failed_when: forward_probe.stdout | trim != item.ip

    - name: Validar resolucao reversa
      ansible.builtin.command:
        argv: [dig, '@192.168.56.120', +short, -x, "{{ item.ip }}"]
      loop: "{{ server_records }}"
      register: reverse_probe
      changed_when: false
      failed_when: reverse_probe.stdout | trim != item.name + '.' + domain + '.'

    - name: Confirmar resolvedor normal do convidado
      ansible.builtin.command: "getent ahostsv4 db.{{ domain }}"
      register: resolver_probe
      changed_when: false
      failed_when: "'192.168.56.121' not in resolver_probe.stdout"

    - name: Conferir interface do processo DHCP
      ansible.builtin.command: pgrep -a dhcpd
      register: dhcp_process
      changed_when: false
      failed_when: "'eth1' not in dhcp_process.stdout or 'eth0' in dhcp_process.stdout"

    - name: Inspecionar discos sem modifica-los
      ansible.builtin.command: lsblk -bn -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS
      changed_when: false
      register: disks_probe

    - name: Registrar discos sem modifica-los
      ansible.builtin.debug:
        var: disks_probe.stdout_lines

    # Este teste de protocolo NAO equivale a uma concessao DHCP real.
    # Recusar caso cli ja tenha registros para nao apagar dados de clientes.
    - name: Conferir ausencia de registro real de cli antes do teste
      ansible.builtin.command:
        argv: [dig, '@127.0.0.1', +short, "cli.{{ domain }}", A]
      register: cli_before
      changed_when: false
      failed_when: cli_before.stdout | trim != ''
      when: groups.get('clients', []) | length == 0

    - name: Conferir PTR livre para teste controlado
      ansible.builtin.command: dig @127.0.0.1 +short -x 192.168.56.100
      register: ptr_before
      changed_when: false
      failed_when: ptr_before.stdout | trim != ''
      when: groups.get('clients', []) | length == 0

    - name: Testar TSIG de modo temporario e limpar os registros
      when: groups.get('clients', []) | length == 0
      block:
        - name: Atualizar A e PTR com chave TSIG local
          ansible.builtin.command:
            argv: [nsupdate, -k, /etc/dhcp/ddns.key]
            stdin: |
              server 127.0.0.1
              zone {{ domain }}.
              update add cli.{{ domain }}. 60 A 192.168.56.100
              send
              zone {{ reverse_zone }}.
              update add 100.{{ reverse_zone }}. 60 PTR cli.{{ domain }}.
              send
          changed_when: true

        - name: Consultar A atualizado
          ansible.builtin.command: "dig @127.0.0.1 +short cli.{{ domain }} A"
          register: ddns_a
          changed_when: false
          failed_when: ddns_a.stdout | trim != '192.168.56.100'

        - name: Consultar PTR atualizado
          ansible.builtin.command: dig @127.0.0.1 +short -x 192.168.56.100
          register: ddns_ptr
          changed_when: false
          failed_when: ddns_ptr.stdout | trim != 'cli.' + domain + '.'

        - name: Verificar recusa de atualizacao sem assinatura
          ansible.builtin.command:
            argv: [nsupdate]
            stdin: |
              server 127.0.0.1
              zone {{ domain }}.
              update add cli.{{ domain }}. 60 A 192.168.56.99
              send
          register: unsigned_update
          changed_when: false
          failed_when: unsigned_update.rc == 0 or 'REFUSED' not in unsigned_update.stderr
      always:
        - name: Remover somente os registros temporarios de cli
          ansible.builtin.command:
            argv: [nsupdate, -k, /etc/dhcp/ddns.key]
            stdin: |
              server 127.0.0.1
              zone {{ domain }}.
              update delete cli.{{ domain }}. A
              send
              zone {{ reverse_zone }}.
              update delete 100.{{ reverse_zone }}. PTR
              send
          changed_when: true

    - name: Revalidar journals apos teste DDNS
      ansible.builtin.command: "named-checkzone -j {{ item.zone }} {{ item.file }}"
      loop:
        - { zone: "{{ domain }}", file: /var/lib/bind/db.forward }
        - { zone: "{{ reverse_zone }}", file: /var/lib/bind/db.reverse }
      changed_when: false
